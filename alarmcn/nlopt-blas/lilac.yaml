#

maintainers:
  - github: yuyichao

pre_build_script: update_pkgver_and_pkgrel(_G.newver.lstrip('v'))

post_build: git_pkgbuild_commit

update_on:
  - source: github
    github: stevengj/nlopt
    use_max_tag: true
    include_regex: 'v(\d+.\d+.\d+)'
  - source: alpm
    from_pattern: ^(\d+\.\d+)\..*
    to_pattern: \1
    alpm: guile
  - source: alpm
    from_pattern: ^(\d+\.\d+\.\d+).*
    to_pattern: \1
    alpm: octave
  - alias: python
  - source: manual
    manual: 1
