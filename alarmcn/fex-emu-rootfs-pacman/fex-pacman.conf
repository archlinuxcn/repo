# pacman configuration for the x86_64 FEX-Emu rootfs managed by fex-pacman.
# Everything lives under the rootfs (/var/lib/fex-emu/root), the parts that
# don't make sense on the host (/etc, /var, ...) are hidden from FEX-Emu.

[options]
RootDir = /var/lib/fex-emu/root
DBPath = /var/lib/fex-emu/root/var/lib/pacman/
CacheDir = /var/lib/fex-emu/root/var/cache/pacman/pkg/
LogFile = /var/lib/fex-emu/root/var/log/pacman.log
GPGDir = /var/lib/fex-emu/root/etc/pacman.d/gnupg/
# Not relative to RootDir, the host hooks in /etc/pacman.d/hooks must not run
# in the rootfs.
HookDir = /var/lib/fex-emu/root/etc/pacman.d/hooks/
Architecture = x86_64
HoldPkg = pacman glibc
Color
ParallelDownloads = 5
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[extra]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[multilib]
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch

[archlinuxcn]
Server = https://repo.archlinuxcn.org/$arch
