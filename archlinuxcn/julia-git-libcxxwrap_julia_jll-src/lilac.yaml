maintainers:
  - github: yuyichao

post_build: git_pkgbuild_commit

repo_depends:
  - julia-git
  - julia-pkg-scripts
  - libcxxwrap_julia

update_on:
  - source: regex
    url: https://build.archlinuxcn.org/~yuyichao/julia/pkgs/libcxxwrap_julia_jll/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: manual
    manual: 1
