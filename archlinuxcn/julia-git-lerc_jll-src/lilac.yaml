maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit
repo_depends:
  - julia-git
  - julia-pkg-scripts
  - lerc

update_on:
  - source: regex
    url: 
        https://build.archlinuxcn.org/~yuyichao/julia/pkgs/LERC_jll/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: alpmfiles
    pkgname: lerc
    strip_dir: true
    filename: libLerc.so.\d+
  - source: manual
    manual: 1
