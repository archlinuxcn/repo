maintainers:
  - github: nlsdt
    email: nlsdt <nlsdt@archlinuxcn.org>

build_prefix: archlinuxcn-x86_64

repo_depends:
  - qmlmaterial

repo_makedepends:
  - lito

pre_build_script: update_pkgver_and_pkgrel(_G.newver)
post_build_script: git_pkgbuild_commit()

update_on:
  - source: github
    github: waywallen/waywallen
    use_latest_release: true
    prefix: v
  - source: alpm
    alpm: qmlmaterial
    provided: libqml_material.so
    repo: archlinuxcn
