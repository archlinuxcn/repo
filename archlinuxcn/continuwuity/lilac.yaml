maintainers:
  - github: Kimiblock

pre_build_script: |
  aur_pre_build(maintainers=['Kimiblock', 'ThisIsAsen'])
  update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()

update_on:
  - source: "gitea"
    gitea: "continuwuation/continuwuity"
    host: "forgejo.ellis.link"
    #use_latest_release: true
    use_max_tag: true
    prefix: "v"
    from_pattern: '-'
    to_pattern: '_'
  - source: alpm
    alpm: zstd
    provided: libzstd.so
    strip_release: true
  - source: alpm
    alpm: jemalloc
    provided: libjemalloc.so
    strip_release: true
build_prefix: extra-x86_64
