maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit
repo_depends:
  - julia-git
  - julia-pkg-scripts

update_on:
  - source: regex
    url: 
        https://build.archlinuxcn.org/~yuyichao/julia/pkgs/libfdk_aac_jll/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: alpm
    alpm: libfdk-aac
    provided: libfdk-aac.so
  - source: manual
    manual: 1
