maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit
repo_depends:
  - julia-git
  - julia-pkg-scripts

update_on:
  - source: regex
    url: 
        https://build.archlinuxcn.org/~yuyichao/julia/pkgs/libevent_jll/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: alpmfiles
    pkgname: libevent
    strip_dir: true
    filename: libevent-[0-9.]*.so.\d+
  - source: alpmfiles
    pkgname: libevent
    strip_dir: true
    filename: libevent_core-[0-9.]*.so.\d+
  - source: alpmfiles
    pkgname: libevent
    strip_dir: true
    filename: libevent_pthreads-[0-9.]*.so.\d+
  - source: manual
    manual: 1
