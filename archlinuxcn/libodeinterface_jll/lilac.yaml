maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit
repo_depends:
  - julia-git
  - openspecfun-git
  - openlibm-git
update_on:
  - source: regex
    url: https://build.archlinuxcn.org/~yuyichao/julia/pkgs/ODEInterface/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: manual
    manual: 2
