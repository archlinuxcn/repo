maintainers:
  - github: poscat0x04

pre_build_script: |
  aur_pre_build(maintainers=['Martchus'])
post_build_script: |
  aur_post_build()

repo_depends:
  - c++utilities
  - qtutilities-qt6
  - qtforkawesome-qt6

update_on:
  - source: aur
  - source: alpm
    alpm: boost-libs
    provided: libboost_filesystem.so

update_on_build:
  - pkgbase: c++utilities
  - pkgbase: qtutilities-qt6
  - pkgbase: qtforkawesome-qt6
