maintainers:
  - github: cryolitia
    email: Cryolitia <cryolitia@gmail.com>

build_prefix: archlinuxcn-x86_64

pre_build_script: |
    newver = _G.newver
    update_pkgver_and_pkgrel(newver.replace('-', ''), updpkgsums=False)

    for line in edit_file('PKGBUILD'):
        if line.startswith('_pkgver='):
            line = f'_pkgver={newver}'
        elif line.startswith('pkgver='):
            line = 'pkgver=${_pkgver//-/}'
        print(line)

    run_protected(["updpkgsums"])

post_build_script: |
    git_pkgbuild_commit()
    update_aur_repo()

update_on:
  - source: github
    github: MaaAssistantArknights/MaaAssistantArknights
    prefix: v
    use_max_tag: true
    include_regex: 'v(\d+.\d+.\d+)(-beta.\d+)?'
