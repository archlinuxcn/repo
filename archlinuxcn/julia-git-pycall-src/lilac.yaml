maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit
repo_depends:
  - julia-git
  - julia-pkg-scripts
  - julia-git-conda-src
  - julia-git-json-src
  - julia-git-parsers-src
  - julia-git-precompiletools-src
  - julia-git-preferences-src
  - julia-git-versionparsing-src
update_on:
  - source: regex
    url: https://build.archlinuxcn.org/~yuyichao/julia/pkgs/PyCall/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - alias: python
  - source: manual
    manual: 4
