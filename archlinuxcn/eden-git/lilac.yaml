maintainers:
  - github: heavysink
    email: winstonwu91@gmail.com

build_prefix: extra-x86_64

pre_build: vcs_update

post_build: git_pkgbuild_commit

repo_depends:
  - cubeb-git
  - game-devices-udev
  - cpp-jwt

update_on:
  - source: alpm
    alpm: fmt
    repo: extra
  - source: alpm
    alpm: cpp-httplib
    repo: extra
  - source: alpm
    alpm: cpp-jwt
    repo: archlinuxcn
  - source: alpm
    alpm: openssl
  - alias: boost
  - source: git
    git: https://git.eden-emu.dev/eden-emu/eden.git
    use_commit: true
