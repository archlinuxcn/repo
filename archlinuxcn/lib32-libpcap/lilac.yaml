maintainers:
  - github: RocketMaDev
    email: Rocket Ma <marocketbd@gmail.com>

build_prefix: multilib
repo_depends:
  - lib32-libnl

pre_build_script: update_pkgver_and_pkgrel(_G.newver)
post_build: git_pkgbuild_commit

update_on:
  - source: github
    github: the-tcpdump-group/libpcap
    use_max_tag: true
    include_regex: '^libpcap-\d+\.\d+\.\d+$'
    prefix: libpcap-
