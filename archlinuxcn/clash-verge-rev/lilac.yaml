maintainers:
  - github: Integral-Tech
    email: integral@archlinuxcn.org

post_build_script: |
    git_pkgbuild_commit()
    update_aur_repo()

build_prefix: archlinuxcn-x86_64

update_on:
  - source: github
    github: clash-verge-rev/clash-verge-rev
    use_max_tag: true
    prefix: v
    include_regex: '^v\d+\.\d+\.\d+$'

  - source: github
    github: clash-verge-rev/clash-verge-service-ipc
    use_latest_release: true
    prefix: v
