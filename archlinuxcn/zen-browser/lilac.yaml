  pkgbuild = Path('PKGBUILD')
  text = pkgbuild.read_text()
  text, count = re.subn(
    r"  echo 'Building instrumented browser\.\.\.'\n.*?(?=  echo 'Building optimized browser\.\.\.')",
    '  # The instrumented browser crashes during PGO profile initialization.\n',
    text, flags=re.S)
