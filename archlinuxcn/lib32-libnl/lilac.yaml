maintainers:
  - github: RocketMaDev
    email: Rocket Ma <marocketbd@gmail.com>

build_prefix: multilib

pre_build_script: update_pkgver_and_pkgrel(_G.newver)
post_build: git_pkgbuild_commit

update_on:
  - source: github
    github: thom311/libnl
    use_max_tag: true
    include_regex: '^libnl\d+_\d+_\d+$'
    from_pattern: 'libnl(\d+)_(\d+)_(\d+)'
    to_pattern: '\1.\2.\3'
