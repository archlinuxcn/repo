maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit
repo_depends:
  - julia-git
  - julia-pkg-scripts

  - metis
  - parmetis
update_on:
  - source: regex
    url: https://build.archlinuxcn.org/~yuyichao/julia/pkgs/HYPRE_jll/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: alpmfiles
    pkgname: hypre
    strip_dir: true
    filename: libHYPRE\.so\.\d+
  - source: manual
    manual: 1
