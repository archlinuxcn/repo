maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit
repo_depends:
  - julia-git
  - julia-pkg-scripts

update_on:
  - source: regex
    url: https://build.archlinuxcn.org/~yuyichao/julia/pkgs/OpenEXR_jll/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: alpm
    alpm: openexr
    from_pattern: ^(\d+\.\d+)\..*
    to_pattern: \1
  - source: manual
    manual: 2
