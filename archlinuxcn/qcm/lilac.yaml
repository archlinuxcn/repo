maintainers:
  - github: Integral-Tech
    email: integral@archlinuxcn.org

pre_build_script: update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
  update_aur_repo()

repo_depends:
  - qmlmaterial

repo_makedepends:
  - lito
  - vulkan-memory-allocator-git

update_on:
  - source: github
    github: hypengw/Qcm
    use_latest_tag: true
    prefix: v

  - alias: qt6-base
  - alias: fmt

  - source: alpm
    alpm: ffmpeg
    provided: libavformat.so
    strip_release: true
