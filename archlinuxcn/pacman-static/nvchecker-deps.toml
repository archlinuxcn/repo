[__config__]
oldver = "nvchecker-old.txt"
newver = "nvchecker-new.txt"
max_concurrency = 1

[nghttp2]
source = "archpkg"
archpkg = "libnghttp2"

[curl]
source = "archpkg"
archpkg = "curl"

[ssl]
source = "archpkg"
archpkg = "openssl"

[brotli]
source = "archpkg"
archpkg = "brotli"

[zlib]
source = "archpkg"
archpkg = "zlib"

[xz]
source = "archpkg"
archpkg = "xz"

[bzip]
source = "archpkg"
archpkg = "bzip2"

[zstd]
source = "archpkg"
archpkg = "zstd"

# EXCEPTION (2026-10-15): our bundled _libarchive_ver is intentionally
# ahead of this archpkg baseline right now (3.8.10 vs Arch's 3.8.9-1) --
# we track libarchive's own upstream releases directly for this bump,
# not Arch's repackage cadence. Expected to self-resolve once Arch
# repackages libarchive 3.8.10; not a regression, don't "fix" by
# reverting to 3.8.9.
[libarchive]
source = "archpkg"
archpkg = "libarchive"

[gpgerror]
source = "archpkg"
archpkg = "libgpg-error"

[libassuan]
source = "archpkg"
archpkg = "libassuan"

[gpgme]
source = "archpkg"
archpkg = "gpgme"

[libseccomp]
source = "archpkg"
archpkg = "libseccomp"
