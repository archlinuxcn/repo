maintainers:
  - github: hour-keeper
build_prefix: extra-x86_64
pre_build_script: |
  aur_pre_build(maintainers=['hour-keeper'])
  update_pkgver_and_pkgrel(_G.newver.lstrip('v'))
post_build_script: |
  aur_post_build()
  update_aur_repo()
update_on:
  - source: github
    github: SagerNet/sing-box
    use_max_release: true
  - source: aur
    aur: sing-box-for-linux-bin
