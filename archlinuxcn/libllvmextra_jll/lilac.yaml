maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit

repo_depends:
  - llvm-julia-git
  - llvm-julia-git: llvm-libs-julia-git

update_on:
  - source: regex
    url: https://build.archlinuxcn.org/~yuyichao/julia/pkgs/LLVM/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: manual
    manual: 3
