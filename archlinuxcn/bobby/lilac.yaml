maintainers:
  - github: Kimiblock

pre_build_script: update_pkgver_and_pkgrel(_G.newver)
post_build_script: |
  git_pkgbuild_commit()
#  update_aur_repo()

update_on:
  - source: "git"
    git: "https://github.com/hbons/Bobby"
    prefix: v
  - source: "alpm"
    alpm: "sqlite"
    provided: libsqlite3.so
    strip_release: true
  - source: "alpm"
    alpm: "libadwaita"
    provided: libadwaita-1.so
    strip_release: true
  - source: "alpm"
    alpm: "gtk4"
    provided: libgtk-4.so
    strip_release: true

build_prefix: extra-x86_64
