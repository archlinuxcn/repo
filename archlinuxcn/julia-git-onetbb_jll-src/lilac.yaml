maintainers:
  - github: yuyichao

post_build: git_pkgbuild_commit

repo_depends:
  - julia-git
  - julia-pkg-scripts

update_on:
  - source: regex
    url: https://build.archlinuxcn.org/~yuyichao/julia/pkgs/oneTBB_jll/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: alpmfiles
    pkgname: onetbb
    strip_dir: true
    filename: libtbb.so.\d+
  - source: alpmfiles
    pkgname: onetbb
    strip_dir: true
    filename: libtbbmalloc.so.\d+
  - source: alpmfiles
    pkgname: onetbb
    strip_dir: true
    filename: libtbbmalloc_proxy.so.\d+
  - source: manual
    manual: 1
