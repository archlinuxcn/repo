maintainers:
  - github: lilydjwg

update_on:
  - source: github
    github: telegramdesktop/tdesktop
    use_latest_release: true
  # - source: manual
  #   manual: v5.13.1
  - source: alpm
    alpm: ffmpeg
    provided: libavcodec.so
  - source: alpm
    from_pattern: ^(\d+\.\d+\.\d+)\..*
    to_pattern: \1
    alpm: qt6-base
    strip_release: true
  - source: alpm
    alpm: abseil-cpp
    strip_release: true
  - source: alpm
    alpm: libvpx
    provided: libvpx.so
  - source: alpm
    alpm: opus
    provided: libopus.so
  - alias: libssl
  - alias: libcrypto
  - source: alpm
    alpm: openh264
    provided: libopenh264.so
  - source: alpmfiles
    pkgname: ada
    filename: 'usr/lib/libada\.so\.(\d+)'
  - source: alpm
    alpm: libjxl
    provided: libjxl.so
