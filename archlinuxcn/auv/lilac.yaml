maintainers:
  - github: qyl27

build_prefix: extra-x86_64

pre_build_script: |
  update_pkgver_and_pkgrel(_G.newver)

post_build_script: |
  git_pkgbuild_commit()

update_on:
  - source: github
    github: moeru-ai/auv
    use_latest_release: true
    prefix: v
  - source: alpm
    alpm: tesseract
    provided: libtesseract.so
  - source: alpmfiles
    pkgname: leptonica
    filename: 'usr/lib/libleptonica\.so\.(\d+)$'
  - source: manual
    manual: 1
