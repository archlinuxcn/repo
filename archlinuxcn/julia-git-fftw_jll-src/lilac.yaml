maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit
repo_depends:
  - julia-git
  - julia-pkg-scripts

update_on:
  - source: regex
    url: 
        https://build.archlinuxcn.org/~yuyichao/julia/pkgs/FFTW_jll/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: alpm
    alpm: fftw
    provided: libfftw3_threads.so
  - source: alpm
    alpm: fftw
    provided: libfftw3f_threads.so
  - source: manual
    manual: 3
