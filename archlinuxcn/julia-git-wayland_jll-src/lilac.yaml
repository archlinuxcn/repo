maintainers:
  - github: yuyichao
post_build: git_pkgbuild_commit
repo_depends:
  - julia-git
  - julia-pkg-scripts

update_on:
  - source: regex
    url: 
        https://build.archlinuxcn.org/~yuyichao/julia/pkgs/Wayland_jll/version
    regex: 'version: *([^ ]*@[^ ]*)'
  - source: alpm
    alpm: wayland
    provided: libwayland-client.so
  - source: alpm
    alpm: wayland
    provided: libwayland-cursor.so
  - source: alpm
    alpm: wayland
    provided: libwayland-egl.so
  - source: alpm
    alpm: wayland
    provided: libwayland-server.so
  - source: manual
    manual: 1
